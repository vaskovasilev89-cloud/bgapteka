# Build-ва web/ и го качва в MonsterASP (bgapteka.runasp.net) чрез Web Deploy
# при всеки push в main. Потребител и парола: GitHub → Settings → Secrets and variables → Actions
# → Secrets → New repository secret:
#   WEBDEPLOY_USER      потребител от панела: Overview → Visual Studio access (напр. site110353)
#   WEBDEPLOY_PASSWORD  паролата от същото място (не паролата за вход в панела)
name: Deploy to MonsterASP

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WEBDEPLOY_SERVER: site110353.siteasp.net
  WEBDEPLOY_SITE: site110353

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet publish web/BgApteka.Web.csproj -c Release -o publish

      - name: Deploy (Web Deploy)
        shell: pwsh
        env:
          SERVER: ${{ env.WEBDEPLOY_SERVER }}
          SITE: ${{ env.WEBDEPLOY_SITE }}
          USER: ${{ secrets.WEBDEPLOY_USER || vars.WEBDEPLOY_USER }}
          PASS: ${{ secrets.WEBDEPLOY_PASSWORD }}
        run: |
          if (-not $env:USER) { throw "Липсва secret WEBDEPLOY_USER (Settings → Secrets and variables → Actions → Secrets)" }
          if (-not $env:PASS) { throw "Липсва secret WEBDEPLOY_PASSWORD (Settings → Secrets and variables → Actions → Secrets)" }
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $src = (Resolve-Path publish).Path
          $msargs = @(
            "-verb:sync",
            "-source:contentPath=$src",
            "-dest:contentPath=$env:SITE,computerName=https://$($env:SERVER):8172/msdeploy.axd?site=$env:SITE,userName=$env:USER,password=$env:PASS,authType=Basic",
            "-allowUntrusted",
            "-enableRule:AppOffline",          # спира приложението, докато се сменят файловете
            "-enableRule:DoNotDeleteRule",     # не трие нищо на сървъра (App_Data, logs и т.н.)
            "-retryAttempts:3"
          )
          & $msdeploy @msargs
          if ($LASTEXITCODE -ne 0) { throw "msdeploy failed ($LASTEXITCODE)" }
