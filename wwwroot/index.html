<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сравни цени в аптеките</title>
<style>
  :root{
    --bg:#f6f7f5; --card:#fff; --ink:#1d2421; --muted:#68736e; --line:#e3e7e4;
    --accent:#0f7b5f; --accent-soft:#e3f3ee; --warn:#b4541a; --bad:#b42318;
    --radius:12px;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  .top{display:flex;align-items:center;gap:16px;padding:14px 0}
  .logo{font-weight:700;font-size:18px;white-space:nowrap}
  .logo span{color:var(--accent)}
  .search{flex:1;position:relative}
  .search input{width:100%;font:inherit;font-size:17px;padding:12px 16px;border:1.5px solid var(--line);border-radius:10px;outline:none;background:#fbfcfb}
  .search input:focus{border-color:var(--accent);background:#fff}
  .filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:0 0 12px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;user-select:none;color:var(--muted)}
  .chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip input{display:none}
  .spacer{flex:1}
  button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;padding:7px 13px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  main{padding:20px 0 60px}
  .summary{color:var(--muted);margin:0 0 14px}
  .group{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  .ghead{display:flex;gap:14px;padding:14px 16px;align-items:center}
  .ghead img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#fff;flex:none}
  .ghead .ph{width:64px;height:64px;border-radius:8px;background:var(--bg);flex:none}
  .gname{font-weight:600;font-size:16px}
  .gmeta{color:var(--muted);font-size:13px}
  .best{margin-left:auto;text-align:right;white-space:nowrap}
  .best .p{font-size:22px;font-weight:700;color:var(--accent)}
  .best .s{font-size:13px;color:var(--muted)}
  table{width:100%;border-collapse:collapse}
  td{padding:9px 16px;border-top:1px solid var(--line);vertical-align:middle}
  tr.cheapest td{background:var(--accent-soft)}
  td.site{width:150px;font-weight:600}
  td.oname{color:var(--muted);font-size:13.5px}
  td.oname a{color:inherit}
  td.price{width:120px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.price del{color:var(--muted);font-weight:400;font-size:12px;margin-right:6px}
  td.go{width:110px;text-align:right;white-space:nowrap}
  td.go a{color:var(--accent);text-decoration:none;font-size:13px}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
  .badge.low{background:var(--accent);color:#fff}
  .badge.out{background:#f8e8e6;color:var(--bad)}
  .more{padding:8px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--accent);cursor:pointer}
  .empty{text-align:center;color:var(--muted);padding:60px 20px}
  /* статус панел */
  #panel{display:none;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:18px}
  #panel.open{display:block}
  .srow{display:grid;grid-template-columns:150px 1fr 110px 90px;gap:12px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .srow:first-of-type{border-top:0}
  .bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
  .bar i{display:block;height:100%;background:var(--accent);width:0}
  .smsg{color:var(--muted);font-size:12.5px}
  .smsg.err{color:var(--bad)}
  .panel-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  @media (max-width:700px){
    .top{flex-wrap:wrap}.logo{width:100%}
    td.site{width:auto}.td-hide{display:none}
    .srow{grid-template-columns:1fr 90px}.srow .hide-m{display:none}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">Аптеки <span>· сравни цени</span></div>
      <div class="search"><input id="q" type="search" placeholder="Търси продукт, напр. нурофен 400 или 3800123456789" autofocus autocomplete="off"></div>
      <button id="btnPanel" title="Бази и обновяване">Данни ▾</button>
    </div>
    <div class="filters" id="filters">
      <label class="chip" id="chipStock"><input type="checkbox" id="inStock">Само налични</label>
      <span style="width:8px"></span>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="panel">
    <div id="srows"></div>
    <div class="smsg" id="pushMsg" style="margin-top:8px"></div>
    <div class="panel-actions" id="actions">
      <button id="btnPush" hidden>Качи в сайта</button>
      <button id="btnStop" disabled>Спри</button>
      <button id="btnRefresh" class="primary">Обнови всички аптеки</button>
    </div>
  </section>
  <p class="summary" id="summary"></p>
  <div id="results"><div class="empty">Въведи име на продукт, за да видиш в кои аптеки го има и къде е най-евтин.</div></div>
  <p class="smsg" id="note" style="margin-top:24px;text-align:center"></p>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n.toLocaleString("bg-BG",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
const ago = t => { if(!t) return "никога"; const d=(Date.now()/1000-t); if(d<3600) return Math.round(d/60)+" мин"; if(d<86400) return Math.round(d/3600)+" ч"; return Math.round(d/86400)+" дни"; };

let SITES = [], selectedSites = new Set(), timer = null, polling = null, lastQ = "";

// ---------- статус ----------
async function loadStatus(){
  const r = await fetch("/api/status").then(r=>r.json());
  if(!SITES.length){
    SITES = r.sites;
    const f = $("#filters");
    for(const s of SITES){
      const l = document.createElement("label");
      l.className = "chip"; l.dataset.site = s.site; l.textContent = s.title;
      l.onclick = () => { selectedSites.has(s.site) ? selectedSites.delete(s.site) : selectedSites.add(s.site); l.classList.toggle("on"); run(true); };
      f.appendChild(l);
    }
    const total = r.sites.reduce((a,s)=>a+s.products,0);
    if(!total && r.canRefresh) $("#panel").classList.add("open");
  }
  $("#srows").innerHTML = r.sites.map(s => {
    const live = s.live || {}, st = live.state;
    const running = st==="running" || st==="queued";
    const pct = live.found ? Math.min(100, Math.round(100*(live.done||0)/live.found)) : 0;
    const msg = running ? `${esc(live.message||"")} — ${live.done||0} / ${live.found||"?"}` :
                (live.message || (s.last_run && s.last_run.message) || "");
    const err = /грешка|отказва/.test(msg);
    return `<div class="srow">
      <div><b>${esc(s.title)}</b><div class="smsg"><a href="${esc(s.base)}" target="_blank" rel="noopener">${esc(s.base.replace("https://",""))}</a></div></div>
      <div>${running?`<div class="bar"><i style="width:${pct}%"></i></div>`:""}<div class="smsg ${err?"err":""}">${esc(msg)}</div></div>
      <div class="hide-m">${s.products.toLocaleString("bg-BG")} продукта<div class="smsg">обновено преди ${ago(s.last_update)}</div></div>
      <div style="text-align:right">${r.canRefresh?`<button data-one="${esc(s.site)}" ${r.running?"disabled":""}>Обнови</button>`:""}</div>
    </div>`;
  }).join("");
  document.querySelectorAll("[data-one]").forEach(b => b.onclick = () => startRefresh([b.dataset.one]));
  $("#actions").hidden = !r.canRefresh;
  $("#note").textContent = r.note || "";
  $("#btnPush").hidden = !r.remote;
  $("#btnPush").title = r.remote ? "Качва локалната база в " + r.remote : "";
  const pu = r.push || {};
  $("#pushMsg").textContent = r.canRefresh ? (r.remote ? (pu.message ? "Качване: " + pu.message : "Публичен сайт: " + r.remote) : "Качването в публичния сайт не е настроено (scraper/config.json).") : (r.note || "");
  $("#btnPush").disabled = r.running || pu.state === "running";
  if(pu.state === "running" && !polling) polling = setInterval(loadStatus, 2000);
  $("#btnRefresh").disabled = r.running;
  $("#btnStop").disabled = !r.running;
  $("#btnRefresh").textContent = r.running ? "Обновява се…" : "Обнови всички аптеки";
  if(r.running && !polling) polling = setInterval(loadStatus, 2000);
  if(!r.running && pu.state !== "running" && polling){ clearInterval(polling); polling = null; if(lastQ) run(true); }
}
async function startRefresh(sites){
  const r = await fetch("/api/refresh",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sites})}).then(r=>r.json());
  if(!r.started) alert(r.message);
  $("#panel").classList.add("open");
  loadStatus();
}
$("#btnRefresh").onclick = () => startRefresh(null);
$("#btnPush").onclick = async () => { await fetch("/api/push",{method:"POST"}); loadStatus(); };
$("#btnStop").onclick = async () => { await fetch("/api/stop",{method:"POST"}); loadStatus(); };
$("#btnPanel").onclick = () => $("#panel").classList.toggle("open");

// ---------- търсене ----------
$("#q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(()=>run(), 250); });
$("#chipStock").onclick = e => { if(e.target.tagName!=="INPUT") return; $("#chipStock").classList.toggle("on", $("#inStock").checked); run(true); };

async function run(force){
  const q = $("#q").value.trim();
  if(!force && q === lastQ) return;
  lastQ = q;
  const url = new URL(location.href); q ? url.searchParams.set("q", q) : url.searchParams.delete("q"); history.replaceState(null,"",url);
  if(q.length < 2){ $("#summary").textContent = ""; $("#results").innerHTML = `<div class="empty">Въведи поне 2 символа.</div>`; return; }
  const p = new URLSearchParams({q, in_stock: $("#inStock").checked, sites: [...selectedSites].join(",")});
  const r = await fetch("/api/search?"+p).then(r=>r.json());
  if(q !== $("#q").value.trim()) return;  // остарял отговор
  render(r);
}

function render(r){
  if(!r.groups.length){
    $("#summary").textContent = "";
    $("#results").innerHTML = `<div class="empty">Няма намерени продукти за „${esc(r.query)}“.<br>Опитай с по-кратко име или провери дали базата е обновена (бутон „Данни“).</div>`;
    return;
  }
  const all = r.groups.flatMap(g=>g.offers);
  const cheapest = all.filter(o=>o.in_stock!==0).sort((a,b)=>a.price-b.price)[0] || all[0];
  $("#summary").innerHTML = `${r.groups.length} продукта, ${r.offers} оферти. Най-ниска цена сред резултатите: <b>${fmt(cheapest.price)}</b> в <b>${esc(cheapest.site_title)}</b>.`;
  // групи само с изчерпани продукти – най-отдолу
  const groups = r.groups.map((g,i)=>({g,i,out:g.offers.every(o=>o.in_stock===0)})).sort((a,b)=>(a.out-b.out)||(a.i-b.i)).map(x=>x.g);
  $("#results").innerHTML = groups.map((g,i) => {
    const offers = g.offers, show = 6;
    const best = offers[0];
    const rows = offers.map((o,j) => `
      <tr class="${j===0&&offers.length>1&&o.in_stock!==0?"cheapest":""}" ${j>=show?'data-hidden hidden':''}>
        <td class="site">${esc(o.site_title)}${j===0&&offers.length>1&&o.in_stock!==0?'<span class="badge low">най-евтино</span>':""}${o.in_stock===0?'<span class="badge out">няма наличност</span>':""}</td>
        <td class="oname td-hide"><a href="${esc(o.url)}" target="_blank" rel="noopener">${esc(o.name)}</a></td>
        <td class="price">${o.old_price?`<del>${fmt(o.old_price)}</del>`:""}${fmt(o.price)}</td>
        <td class="go"><a href="${esc(o.url)}" target="_blank" rel="noopener">към сайта →</a></td>
      </tr>`).join("");
    const diff = g.max_price - g.min_price;
    return `<div class="group">
      <div class="ghead">
        ${g.image?`<img src="${esc(g.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'ph'}))">`:'<div class="ph"></div>'}
        <div>
          <div class="gname">${esc(g.name)}</div>
          <div class="gmeta">В ${g.sites} ${g.sites===1?"аптека":"аптеки"}${g.eans.length?` · баркод ${esc(g.eans.join(", "))}`:""}${diff>0.009?` · разлика до ${fmt(diff)}`:""}</div>
        </div>
        <div class="best"><div class="p">${fmt(best.price)}</div><div class="s">${esc(best.site_title)}</div></div>
      </div>
      <table>${rows}</table>
      ${offers.length>show?`<div class="more" onclick="this.previousElementSibling.querySelectorAll('[data-hidden]').forEach(t=>t.hidden=false);this.remove()">Покажи още ${offers.length-show}</div>`:""}
    </div>`;
  }).join("");
}

const initQ = new URL(location.href).searchParams.get("q");
if(initQ){ $("#q").value = initQ; run(true); }
loadStatus();
</script>
</body>
</html>
